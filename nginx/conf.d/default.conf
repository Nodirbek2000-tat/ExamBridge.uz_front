# ─────────────────────────────────────────────────────────────────────────────
# MEDIA CACHE — listening audio, rasm, speaking yozuvlari
# ─────────────────────────────────────────────────────────────────────────────
# Muammo: /media/ har safar Django ga borardi. Bitta listening mp3 to'liq
# yuklanguncha gunicorn workeri band bo'lib turardi — bir necha o'quvchi
# listening boshlasa butun sayt qotardi.
#
# Yechim: birinchi so'rov Django dan oladi va diskka yozadi, keyingi hammasi
# to'g'ridan-to'g'ri nginx dan ketadi (backend umuman bezovta qilinmaydi).
# Bitta audio yuzlab o'quvchi tomonidan tinglanadi → cache hit ~100%.
#
# Xavfsiz: cache bo'sh bo'lsa ham hammasi eskisidek Django ga proxy qilinadi.
#
# Eslatma: audio qayta yuklanganda Django faylga yangi nom beradi (part1_a8Fk2.mp3)
# — ya'ni URL o'zgaradi va cache eskirmaydi. Faqat admin audioni o'chirib,
# AYNAN o'sha nom bilan qayta yuklasa eski nusxa qolishi mumkin. Bunday holatda:
#   docker-compose exec nginx sh -c "rm -rf /var/cache/nginx/media/*" && \
#   docker-compose exec nginx nginx -s reload
proxy_cache_path /var/cache/nginx/media
                 levels=1:2
                 keys_zone=media_cache:50m
                 max_size=5g
                 inactive=30d
                 use_temp_path=off;

# ─────────────────────────────────────────────────────────────────────────────
# HTTP — exambridge.uz  →  redirect to HTTPS + certbot challenge
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name exambridge.uz www.exambridge.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://exambridge.uz$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTP — nodir.exambridge.uz  →  redirect to HTTPS + certbot challenge
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name nodir.exambridge.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS — exambridge.uz  →  React SPA
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name exambridge.uz www.exambridge.uz;

    ssl_certificate     /etc/letsencrypt/live/exambridge.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exambridge.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # www → non-www canonical redirect
    if ($host = www.exambridge.uz) {
        return 301 https://exambridge.uz$request_uri;
    }

    root  /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # React SPA — client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store";
    }

    # Static assets — cache aggressively (Vite adds content hash to filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API calls (relative /api/) → Django backend ───────────────────────────
    # resolver + set $backend: nginx DNS-ni request vaqtida hal qiladi,
    # backend ishlamasa ham nginx ishga tushadi (startup crash bo'lmaydi)
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://web:8000;
        proxy_pass         $backend;
        proxy_set_header   Host              nodir.exambridge.uz;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
        proxy_http_version 1.1;
        client_max_body_size 100M;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ── Media files → nginx cache, faqat cache'da yo'q bo'lsa Django ga ───────
    location /media/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://web:8000;
        proxy_pass         $backend;
        proxy_set_header   Host              nodir.exambridge.uz;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_http_version 1.1;

        # Django (5.2) fayllarni Range — ya'ni "faylning shu joyidan ber"
        # so'rovlarisiz uzatadi. Shuning uchun audio ichiga o'tkazish (5 soniya
        # oldinga/orqaga, progress barni bosish) ishlamasdi.
        # Yechim: Range'ni backendga uzatmaymiz — nginx faylni to'liq olib
        # keshlaydi va kerakli bo'lagini O'ZI beradi.
        proxy_set_header   Range "";
        proxy_cache        media_cache;
        proxy_cache_key    $uri;
        proxy_cache_valid  200 206 30d;
        proxy_cache_valid  404 1m;
        # Bir vaqtda 50 kishi bitta yangi audioni so'rasa — faqat 1 tasi Django ga
        # boradi, qolganlari natijani kutadi (backendga 50 ta so'rov ketmaydi)
        proxy_cache_lock         on;
        proxy_cache_lock_timeout 30s;
        # Backend band yoki o'chgan bo'lsa — eski nusxa berilaveradi (imtihon uzilmaydi)
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # Django sessiya middleware qo'shadigan Vary/Set-Cookie cachega xalaqit bermasin.
        # /media/ ochiq fayllar, userga bog'liq emas.
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header    Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;

        expires 7d;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS — nodir.exambridge.uz  →  Django admin panel + full API
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name nodir.exambridge.uz;

    ssl_certificate     /etc/letsencrypt/live/nodir.exambridge.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nodir.exambridge.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100M;

    # ── Media — bu domenda ham cache (TTS audio, admin panel fayllari) ────────
    location /media/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://web:8000;
        proxy_pass         $backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # Django (5.2) fayllarni Range — ya'ni "faylning shu joyidan ber"
        # so'rovlarisiz uzatadi. Shuning uchun audio ichiga o'tkazish (5 soniya
        # oldinga/orqaga, progress barni bosish) ishlamasdi.
        # Yechim: Range'ni backendga uzatmaymiz — nginx faylni to'liq olib
        # keshlaydi va kerakli bo'lagini O'ZI beradi.
        proxy_set_header   Range "";
        proxy_cache        media_cache;
        proxy_cache_key    $uri;
        proxy_cache_valid  200 206 30d;
        proxy_cache_valid  404 1m;
        proxy_cache_lock         on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header    Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;

        expires 7d;
    }

    # ── Django's own surfaces stay on Django ─────────────────────────────────
    # /admin/   — Django admin
    # /api/     — REST API
    # /static/  — Django collectstatic (admin CSS/JS)
    location ~ ^/(admin|api|static)/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://web:8000;
        proxy_pass         $backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_http_version 1.1;
        client_max_body_size 100M;
        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ── Everything else is the React app ─────────────────────────────────────
    # This subdomain exists for the admin panel, so the bare domain lands there
    # directly instead of on the public marketing page.
    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    location = / {
        return 302 /admin-panel;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store";
    }
}
